version: 2

updates:
    # --- ROOT CONFIGURATION ---
    # Development dependencies in the root: All updates allowed, grouped for efficiency.
    - package-ecosystem: 'npm'
      directory: '/'
      name: 'root-devDependencies'
      allow:
          - dependency-type: 'development'
      exclude-paths:
          - 'packages/**'
          - 'examples/**'
      schedule:
          interval: 'weekly'
      groups:
          devDependencies:
              update-types: [minor, patch]

    # Production dependencies in the root: Patches and Minors allowed (conservative major).
    - package-ecosystem: 'npm'
      directory: '/'
      name: 'root-dependencies'
      allow:
          - dependency-type: 'production'
      exclude-paths:
          - 'packages/**'
          - 'examples/**'
      schedule:
          interval: 'weekly'
      ignore:
          - dependency-name: '*'
            update-types: [version-update:semver-major]

    # --- PACKAGES CONFIGURATION ---
    # Library packages: All updates for devDependencies.
    - package-ecosystem: 'npm'
      directories:
          - 'packages/*'
      name: 'packages-devDependencies'
      allow:
          - dependency-type: 'development'
      schedule:
          interval: 'weekly'
      groups:
          # Use 2026 cross-directory grouping to reduce PR noise across the monorepo
          packages-dev:
              group-by: 'dependency-name'
              update-types: [minor, patch]

    # Library packages: ONLY patches for production/peerDependencies to protect downstream.
    - package-ecosystem: 'npm'
      directories:
          - 'packages/*'
      name: 'packages-production'
      allow:
          - dependency-type: 'production'
      schedule:
          interval: 'weekly'
      ignore:
          - dependency-name: '*'
            update-types: [version-update:semver-major, version-update:semver-minor]
      groups:
          packages-prod-patches:
              group-by: 'dependency-name'
              update-types: [patch]

    # --- EXAMPLES CONFIGURATION ---
    # Application examples: All updates allowed to keep them fresh.
    - package-ecosystem: 'npm'
      directories:
          - 'examples/*/*'
      name: 'examples'
      schedule:
          interval: 'weekly'
      # No restrictions or groupings for examples

    # --- GITHUB ACTIONS ---
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          github-actions-updates:
              patterns: ['*']
